{% extends "_base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<main class="max-w-sm mx-auto pt-16">
  <img src="/static/icons/icon-192.png" alt="" class="w-16 h-16 rounded-2xl mx-auto mb-5">
  <h1 class="text-2xl font-bold text-center">FitStudio Express</h1>
  <p class="text-center text-slate-400 mt-1 mb-6">Panel del entrenador</p>
  {% if error %}<p class="rounded-xl bg-red-500/10 text-red-300 text-sm px-4 py-3 mb-4" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="space-y-3">
    <label class="block text-sm text-slate-400">Usuario
      <input name="username" required autocomplete="username" autocapitalize="none" class="{{ FIELD }} mt-1 text-slate-100">
    </label>
    <label class="block text-sm text-slate-400">Contraseña
      <input name="password" type="password" required autocomplete="current-password" class="{{ FIELD }} mt-1 text-slate-100">
    </label>
    <button class="{{ BTN }} w-full">Entrar</button>
  </form>
</main>
{% endblock %}
